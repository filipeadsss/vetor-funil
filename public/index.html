<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Funil Vetor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: barra superior com abas; funil em colunas lado a lado, cada lead é um cartão que se arrasta entre etapas. */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --surface2:#E9EBE5; --ink:#17212B; --mute:#5D6A75; --line:#D8DCD3;
  --accent:#2457D6; --accent-ink:#FFFFFF; --accent-soft:#E3EAFB;
  --ok:#1B7F4B; --ok-soft:#DDF0E5; --warn:#A85A07; --warn-soft:#F8EAD3; --bad:#B3261E; --bad-soft:#F7DEDC;
  --shadow:0 1px 2px rgba(23,33,43,.08),0 4px 14px rgba(23,33,43,.06); color-scheme:light;
  --f-head:'Space Grotesk','Inter',system-ui,sans-serif; --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:14px}
.brand{font-family:var(--f-head);font-weight:700;font-size:20px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand svg{width:22px;height:22px;color:var(--accent)}
.tabs{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:9px}
.tab{border:0;background:transparent;padding:6px 14px;border-radius:7px;color:var(--mute);font-weight:500}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.spacer{flex:1}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.in{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0;width:100%}
.in:focus{border-color:var(--accent)}
.search{width:220px}
.chk{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:13px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Funil */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
@media (max-width:1180px){.board{display:flex;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:12px}.col{flex:0 0 270px}}
.cn{overflow-wrap:anywhere}
.basebar{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px;color:var(--mute)}
.cls{width:auto;padding:2px 4px;border-radius:6px}
tbody tr[data-row]{cursor:pointer}
tbody tr[data-row]:hover{background:var(--surface2)}
.bulk{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--accent-soft);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:13px}
.frow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.frow .in{width:auto}
.col{min-width:0;scroll-snap-align:start;background:var(--cbg,var(--surface2));border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 150px);min-height:160px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.colh{display:flex;align-items:center;gap:8px;padding:2px 4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.colh h2{font-size:14px;font-weight:600;color:var(--ctx,var(--ink))}
.colh .n{margin-left:auto;color:var(--cdm,var(--mute));font-variant-numeric:tabular-nums;font-size:13px}
.coldica{color:var(--cdm,var(--mute));font-size:12px;padding:0 4px 2px}
.cards{display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:40px;padding:1px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:5px;text-align:left;width:100%}
.card:hover{border-color:var(--accent)}
.card.drag{opacity:.45}
.cn{font-weight:600;line-height:1.25}
.cs{color:var(--mute);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;padding:2px 7px;border-radius:99px;background:var(--surface2);color:var(--mute);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.last{font-size:12px;color:var(--mute)}
.vazio{border:1px dashed var(--cac,var(--line));border-radius:10px;padding:14px;color:var(--cdm,var(--mute));font-size:13px;text-align:center}

/* Estado vazio geral */
.empty{max-width:560px;margin:48px auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-size:22px}
.empty p{margin:0;color:var(--mute)}

/* Modal */
.veil{position:fixed;inset:0;background:rgba(10,15,20,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:24px 12px}
.modal{background:var(--bg);border-radius:14px;width:min(760px,100%);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.mh{display:flex;gap:10px;align-items:flex-start}
.mh h2{font-size:20px;flex:1}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
.sec h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font-size:12px;color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stages{display:flex;flex-wrap:wrap;gap:6px}
.stages .btn[aria-pressed="true"]{background:var(--cac,var(--accent));color:#fff;border-color:var(--cac,var(--accent))}
.hist{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow-y:auto}
.h{font-size:13px;border-left:2px solid var(--line);padding-left:9px}
.h small{color:var(--mute)}
.link{color:var(--accent);text-decoration:none;word-break:break-all}
.link:hover{text-decoration:underline}
.val{font-family:var(--f-head);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.conf{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* Métricas */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font:600 24px var(--f-head);font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:12.5px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h3{font-size:15px;margin-bottom:10px}
.cols2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.funnel{display:flex;flex-direction:column;gap:8px}
.fr{display:grid;grid-template-columns:130px 1fr 80px;gap:10px;align-items:center;font-size:13px}
.bar{height:16px;background:var(--surface2);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px}
.fr em{font-style:normal;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--mute);font-size:12.5px;margin:8px 0 0}

/* Importar */
.imp{max-width:760px;display:flex;flex-direction:column;gap:12px}
.imp textarea{min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;resize:vertical}
.prev{font-size:13px;color:var(--mute)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;z-index:80;font-size:13px;max-width:92vw}
.ro{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
@media (max-width:560px){
  .search{width:100%}
  .fab span{display:none}
  .fab{padding:12px}
  .col{flex-basis:84vw;max-height:none}
  .veil{padding:0}
  .modal{border-radius:0;min-height:100%}
  .fr{grid-template-columns:96px 1fr 64px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

[hidden]{display:none!important}
/* Layout com menu lateral */
.app{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:start}
.side{position:sticky;top:14px;display:flex;flex-direction:column;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 10px}
.side .brand{padding:2px 8px 10px}
.nav{display:flex;flex-direction:column;gap:2px}
.tab,.nv{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;background:transparent;padding:8px 10px;border-radius:8px;color:var(--mute);font-weight:500;text-align:left}
.tab:hover,.nv:hover{background:var(--surface2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.navsep{height:1px;background:var(--line);margin:6px 4px}
.bdg{font-style:normal;font-size:11px;min-width:18px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--surface2);color:var(--mute);font-variant-numeric:tabular-nums}
.bdg.warn{background:var(--warn-soft);color:var(--warn)}
.content{min-width:0}
.pbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.pbar h1{font-size:22px}
@media (max-width:860px){
  .app{display:block}
  .side{position:static;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;align-items:center;margin-bottom:12px;gap:2px}
  .side .brand{padding:0 8px;white-space:nowrap}
  .nav{flex-direction:row}
  .tab,.nv{width:auto;white-space:nowrap}
  .navsep{width:1px;height:22px;margin:0 4px;flex:none}
}
/* Cartão com botão Notificar */
.cw{position:relative}
.cw.hasn .cn{padding-right:78px}
.notif{position:absolute;top:8px;right:8px;display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);text-decoration:none}
.notif:hover{background:var(--ok);color:#fff}
.notif svg{width:12px;height:12px}
/* Dashboard */
.pchips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:14px}
.pchips .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stat small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px}
.sect{font-size:16px;margin:22px 0 10px}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;border-bottom:1px solid var(--line)}
.bars .b{flex:1;min-width:2px;height:100%;display:flex;align-items:flex-end}
.bars .b i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0}
.bax{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);margin-top:4px}
.stack{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--line);margin-bottom:6px}
.stack span{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;min-width:0;overflow:hidden;white-space:nowrap}
/* Manual flutuante */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;align-items:center;gap:7px;border:0;border-radius:99px;padding:11px 16px;background:var(--ink);color:var(--bg);font-weight:600;box-shadow:0 6px 20px rgba(23,33,43,.28)}
.fab svg{width:17px;height:17px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:70;background:var(--bg);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(23,33,43,.18);display:flex;flex-direction:column;gap:10px;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px)) 14px}
.drh{display:flex;align-items:center;gap:8px}
.drh h2{font-size:18px;flex:1}
.mcats{display:flex;flex-wrap:wrap;gap:6px}
.mcats .btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mlist{overflow-y:auto;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;padding-bottom:4px}
.mi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0}
.mi summary{cursor:pointer;padding:9px 11px;font-weight:600;display:flex;gap:8px;align-items:center;justify-content:space-between;list-style:none}
.mi summary::-webkit-details-marker{display:none}
.mi[open] summary{border-bottom:1px solid var(--line)}
.mb{padding:9px 11px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.mb p{margin:0}
.mb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.mq{background:var(--accent-soft);border-radius:8px;padding:8px 10px;white-space:pre-line}
body{margin:0}
img{max-width:100%}
.loginwrap{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.loginbox{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.who{font-size:12px;color:var(--mute);padding:6px 10px;overflow-wrap:anywhere}
@media (max-width:860px){.who{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="side" aria-label="Menu">
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5l8 15 8-15"/><path d="M8.5 5L12 11.5 15.5 5" opacity=".55"/></svg>Funil Vetor</div>
  <nav class="nav" role="tablist" aria-label="Seções">
    <button class="tab" role="tab" id="tab-funil" data-v="funil"><span>Funil</span><i class="bdg warn" id="bdgFunil" hidden title="Esboços pedidos ao Filipe"></i></button>
    <button class="tab" role="tab" id="tab-base" data-v="base"><span>Base</span><i class="bdg" id="bdgBase" hidden title="Leads aguardando liberação"></i></button>
    <button class="tab" role="tab" id="tab-dash" data-v="dash"><span>Dashboard</span></button>
    <button class="tab" role="tab" id="tab-importar" data-v="importar"><span>Importar lista</span></button>
  </nav>
  <div class="navsep"></div>
  <button class="nv" id="manualBtn" data-manual="1"><span>Manual da SDR</span></button>
  <button class="nv" id="cfgBtn"><span>Configurações</span></button>
  <div class="navsep"></div>
  <div class="who" id="who"></div>
  <button class="nv" id="sair"><span>Sair</span></button>
</aside>
<div class="content">
  <div class="pbar">
    <h1 id="pgTitle">Funil</h1>
    <div class="spacer"></div>
    <div class="tools" id="tools">
      <input class="in search" id="busca" type="search" placeholder="Buscar clínica, cidade ou telefone" aria-label="Buscar lead">
      <select class="in" id="filtro" aria-label="Filtrar cartões" style="width:auto"></select>
    </div>
    <button class="btn pri" id="novoLead">+ Novo lead</button>
  </div>
  <div id="ro" class="ro" hidden>Você está só visualizando. Para mover cartões e registrar contatos, peça acesso de Contribuidor ao Filipe.</div>
  <main id="main"></main>
</div>
</div>
<div class="loginwrap" id="login" hidden><form class="loginbox" id="loginForm"><div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5l8 15 8-15"/><path d="M8.5 5L12 11.5 15.5 5" opacity=".55"/></svg>Funil Vetor</div><p class="prev" style="margin:0">Entre com o e-mail e a senha criados para você.</p><div class="fld"><label for="lgEmail">E-mail</label><input class="in" id="lgEmail" type="email" autocomplete="username" required></div><div class="fld"><label for="lgSenha">Senha</label><input class="in" id="lgSenha" type="password" autocomplete="current-password" required></div><div class="conf" id="lgErr" hidden></div><button class="btn pri" id="lgGo" type="submit">Entrar</button></form></div>
<div id="modalRoot"></div>
<aside class="drawer" id="drawer" role="dialog" aria-label="Manual da SDR" hidden>
  <div class="drh"><h2>Manual da SDR</h2><button class="btn sm" id="drClose">Fechar</button></div>
  <input class="in" id="mnBusca" type="search" placeholder="Buscar no manual (preço, domínio, pix, dobra…)" aria-label="Buscar no manual">
  <div class="mcats" id="mnCats"></div>
  <div class="mlist" id="mnList"></div>
</aside>
<button class="fab" id="manualFab" aria-expanded="false" data-manual="1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5M9 7h6"/></svg><span>Manual da SDR</span></button>
<div id="toast" class="toast" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
var PRECOS={landing:800,padrao:1200,ampliado:1700};
var NOMES={landing:'Landing Page',padrao:'Site Padrão',ampliado:'Site Ampliado'};
var ETAPAS=[
  {id:'novo',nome:'Novo lead',dica:'Ainda não abordado ou em tentativa',bg:'#ECEEEA',ac:'#7B8590',tx:'#1F2933',dm:'#66717C'},
  {id:'reuniao',nome:'Reunião marcada',dica:'Esboço pedido ao Filipe ao entrar aqui',bg:'#D9F0DC',ac:'#2E8B4A',tx:'#12351D',dm:'#4A6F55'},
  {id:'fechado',nome:'Fechado',dica:'Aceitou, entrada paga ou combinada',bg:'#D6E6FA',ac:'#3B73C4',tx:'#10294D',dm:'#4C6A93'},
  {id:'entregue',nome:'Entregue',dica:'Site publicado e entregue',bg:'#1E5C3C',ac:'#2F9E63',tx:'#FFFFFF',dm:'#BFE3CE'},
  {id:'perdido',nome:'Perdido',dica:'Recusa definitiva',bg:'#F7DCDC',ac:'#B33A3A',tx:'#4D1414',dm:'#8A5555'}
];
var BASE_ETAPA={id:'base',nome:'Na base',dica:'Aguardando liberação',bg:'#ECEEEA',ac:'#7B8590',tx:'#1F2933',dm:'#66717C'};
var ETAPAS_ALL=[BASE_ETAPA].concat(ETAPAS);
var CLASSES={A:['#D3F0EC','#0F6A60'],B:['#FBF1C7','#7A5A00'],C:['#E4E7E3','#4A5560']};
var prop={a:60,b:30,c:10,qtd:20,ordem:'aleatoria'};
var baseF={q:'',st:'todos',cl:'todas',ord:'classe',lote:'todos',max:150,sel:{}};
var CANAIS=['Ligação','WhatsApp','Instagram','E-mail','Reunião'];
var RESULT=[
  {id:'nao_atendeu',nome:'Não atendeu',sug:null},
  {id:'atendeu',nome:'Atendeu, sem definição',sug:null},
  {id:'marcou',nome:'Marcou reunião',sug:'reuniao'},
  {id:'retorno',nome:'Pediu retorno',sug:null},
  {id:'sem_interesse',nome:'Sem interesse agora',sug:null},
  {id:'pensando',nome:'Reunião feita, não fechou',sug:null},
  {id:'fechou',nome:'Fechou',sug:'fechado'},

function save(id,patch){

  var l0=byId[id];
  if(patch.stage&&(!l0||l0.stage!==patch.stage)){var eE=Object.assign({},l0&&l0.etapaEm);eE[patch.stage]=patch.atualizadoEm;patch.etapaEm=eE}
  var ref=db.collection('leads').doc(id);
  var prev=queue[id]||Promise.resolve();
  var p=prev.catch(function(){}).then(function(){return ref.update(patch)});
  queue[id]=p;
  return p.catch(function(e){toast('Não foi possível salvar'+(e&&e.code==='invalid_argument'?': sem permissão de edição':''));throw e});
}
function setStage(id,stage,extra){

/* ---------- Métricas ---------- */
function metricas(){
  var m={total:leads.length,trab:0,atend:0,reun:0,real:0,fech:0,receita:0,lig:0,canais:{},fu:{},caminhos:{},motivos:{},tentAtend:[],venc:0};
  CANAIS.forEach(function(c){m.canais[c]={c:0,at:0,re:0,fe:0}});
  leads.forEach(function(l){
    var cs=l.contatos||[], st=l.stage||'novo';
    if(st==='base')return;
    if(cs.length)m.trab++;
    var iat=cs.findIndex(function(c){return c.resultado!=='nao_atendeu'});
    if(iat>=0){m.atend++;m.tentAtend.push(iat+1)}
    if(['reuniao','fechado','entregue'].indexOf(st)>=0||cs.some(function(c){return c.resultado==='marcou'}))m.reun++;
    if(['fechado','entregue'].indexOf(st)>=0||cs.some(function(c){return c.resultado==='pensando'||c.resultado==='fechou'}))m.real++;
    if(st==='fechado'||st==='entregue'){m.fech++;m.receita+=valorLead(l);
      var path=[];cs.forEach(function(c){if(path[path.length-1]!==c.canal)path.push(c.canal)});
      if(path.length){var k=path.join(' → ');m.caminhos[k]=(m.caminhos[k]||0)+1}}
    if(vencido(l))m.venc++;
    cs.forEach(function(c){
      var p=m.canais[c.canal]||(m.canais[c.canal]={c:0,at:0,re:0,fe:0});
      p.c++;if(c.resultado!=='nao_atendeu')p.at++;if(c.resultado==='marcou')p.re++;if(c.resultado==='fechou')p.fe++;
      if(c.canal==='Ligação')m.lig++;
      if(c.fu){var ft=m.fu[c.fu]||(m.fu[c.fu]={c:0,at:0,re:0,fe:0});ft.c++;if(c.resultado!=='nao_atendeu')ft.at++;if(c.resultado==='marcou')ft.re++;if(c.resultado==='fechou')ft.fe++}
    });
    if(l.motivo){var mo=norm(l.motivo);m.motivos[mo]=(m.motivos[mo]||{t:l.motivo.trim(),n:0});m.motivos[mo].n++}
  });
  return m;
}

var CAMPOS={nome:['nome','clinica','empresa','name'],cidade:['cidade','city','municipio'],especialidade:['especialidade','nicho','categoria','tipo'],telefone:['telefone','whatsapp','fone','celular','phone','tel'],google:['google','maps','link google','perfil google','google maps','url google'],instagram:['instagram','insta','ig'],site:['site','website'],endereco:['endereco','endereço','address'],horario:['horario','horário','horario de funcionamento','funcionamento'],avaliacoes:['avaliacoes','avaliações','reviews','qtd avaliacoes','numero de avaliacoes'],nota:['nota','rating','avaliacao','estrelas'],classe:['classe','classificacao','prioridade','potencial','nivel'],responsavel:['responsavel','decisor'],email:['email','e-mail'],origem:['origem'],obs:['observacoes','observacao','obs','notas']};
function parseTabela(txt){
  txt=String(txt||'').replace(/^﻿/,'').trim();if(!txt)return [];
  if(txt[0]==='['||txt[0]==='{'){try{var j=JSON.parse(txt);return Array.isArray(j)?j:[j]}catch(e){}}
  var first=txt.split(/\r?\n/)[0], sep=first.indexOf('\t')>=0?'\t':(first.split(';').length>first.split(',').length?';':',');
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<txt.length;i++){var ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===sep){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cur);rows.push(row);row=[];cur=''}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  if(rows.length<2)return [];
  var head=rows[0].map(norm);
  return rows.slice(1).filter(function(r){return r.some(function(c){return c.trim()})}).map(function(r){var o={};head.forEach(function(h,i){o[h]=(r[i]||'').trim()});return o});
}
function mapeia(o){
  var keys={};Object.keys(o).forEach(function(k){keys[norm(k)]=o[k]});
  var out={};
  Object.keys(CAMPOS).forEach(function(c){for(var i=0;i<CAMPOS[c].length;i++){var v=keys[norm(CAMPOS[c][i])];if(v!=null&&String(v).trim()!==''){out[c]=String(v).trim();break}}});
  if(out.avaliacoes)out.avaliacoes=parseInt(digits(out.avaliacoes),10)||0;
  if(out.nota)out.nota=parseFloat(String(out.nota).replace(',','.'))||0;
  if(out.classe){var cc=String(out.classe).trim().charAt(0).toUpperCase();if(CLASSES[cc])out.classe=cc;else delete out.classe}
  return out;
}

function planoLiberar(){
  var qtd=parseInt($('#lbQtd').value,10)||0,a=parseFloat($('#lbA').value)||0,b=parseFloat($('#lbB').value)||0,c=parseFloat($('#lbC').value)||0;

  var w={A:a,B:b,C:c};

    for(var i=0;i<qtd;i++){var best=null,bv=-1;['A','B','C'].forEach(function(k){if(w[k]<=0||p[k]>=cap[k])return;var v=w[k]/(p[k]+1);if(v>bv){bv=v;best=k}});if(!best)break;p[best]++}
    return p}
  var ped=reparte({A:1e9,B:1e9,C:1e9}),plano=reparte(disp);
  return {qtd:qtd,soma:a+b+c,disp:disp,ped:ped,plano:plano,total:plano.A+plano.B+plano.C,a:a,b:b,c:c};
}

  var falta=['A','B','C'].filter(function(k){return p.ped[k]>p.plano[k]&&p.disp[k]<p.ped[k]});
  var red=falta.length&&['A','B','C'].some(function(k){return p.plano[k]>p.ped[k]})?' Falta estoque da classe '+falta.join(' e ')+' (ideal '+falta.map(function(k){return p.ped[k]}).join(' e ')+', disponível '+falta.map(function(k){return p.disp[k]}).join(' e ')+'): o restante foi redistribuído entre as outras classes, mantendo a proporção entre elas.':'';
  el.textContent='Vai liberar A '+p.plano.A+' de '+p.disp.A+' disponíveis · B '+p.plano.B+' de '+p.disp.B+' · C '+p.plano.C+' de '+p.disp.C+'. Total: '+p.total+(p.total<p.qtd?' (a base não tem leads suficientes nas classes com porcentagem maior que zero)':'')+'.'+red+' Hoje há '+novos+' cartão(ões) em Novo lead.'+(Math.round(p.soma)!==100?' As porcentagens somam '+Math.round(p.soma)+'; o cálculo ajusta a proporção.':'');
}
function embaralha(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
async function liberar(){
  if(!canWrite)return;var p=planoLiberar();if(!p.total){toast('Nada para liberar com esta proporção');return}
  var ordem=$('#lbOrd').value,ids=[];
  ['A','B','C'].forEach(function(c){
    var cand=leads.filter(function(l){return l.stage==='base'&&l.classe===c});
    cand=ordem==='antigos'?cand.sort(function(a,b){return (a.criadoEm||0)-(b.criadoEm||0)}):embaralha(cand);
    cand.slice(0,p.plano[c]).forEach(function(l){ids.push(l.id)});
  });
  var btn=$('#bLibGo');btn.disabled=true;
  try{
    var agora=Date.now();
    for(var i=0;i<ids.length;i+=5){await Promise.all(ids.slice(i,i+5).map(function(id){return save(id,{stage:'novo',liberadoEm:agora})}))}
    prop={a:p.a,b:p.b,c:p.c,qtd:p.qtd,ordem:ordem};
    db.collection('config').doc('proporcao').set(prop).catch(function(){});
    toast(ids.length+' leads liberados para Novo lead');
  }catch(e){toast('A liberação parou no meio; confira a lista')}
  var b2=$('#bLibGo');if(b2)b2.disabled=false;
}
async function lote(ids,patchFn){
  for(var i=0;i<ids.length;i+=5){await Promise.all(ids.slice(i,i+5).map(function(id){return save(id,patchFn(byId[id]))}))}
}

function criarDb(sb){
  var caches={};
  function erro(e){var m=(e&&e.message)||'erro',er=new Error(m);er.code=/row-level|permission|denied|jwt/i.test(m)?'invalid_argument':((e&&e.code)||'');return er}
  function mk(id,data){return {id:id,data:function(){return data}}}
  function lista(c){return Object.keys(c.map).map(function(id){return mk(id,c.map[id])})}
  function notificar(c){
    var docs=lista(c);
    c.listeners.forEach(function(f){f({docs:docs})});
    c.dl.forEach(function(d){var has=Object.prototype.hasOwnProperty.call(c.map,d.id);d.f({exists:has,data:function(){return c.map[d.id]}})});
  }
  async function carregar(name){
    var from=0,PAGE=1000,all=[];
    for(;;){
      var r=await sb.from('docs').select('id,data').eq('collection',name).order('id').range(from,from+PAGE-1);
      if(r.error)throw r.error;
      all=all.concat(r.data||[]);if(!r.data||r.data.length<PAGE)break;from+=PAGE;
    }
    var m={};all.forEach(function(x){m[x.id]=x.data});return m;
  }
  async function atualizar(c,name,forcar){
    try{
      var m=await carregar(name),mudou=JSON.stringify(m)!==JSON.stringify(c.map);
      c.map=m;c.loaded=true;if(mudou||forcar)notificar(c);
    }catch(e){if(!c.loaded){c.failed=erro(e);c.errs.forEach(function(f){f(c.failed)})}}
  }
  function cache(name){
    var c=caches[name];if(c)return c;
    c=caches[name]={map:{},listeners:[],dl:[],errs:[],loaded:false,failed:null};
    var started=false,go=function(){if(started)return;started=true;atualizar(c,name,true)};
    try{
      sb.channel('rt-'+name).on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'collection=eq.'+name},function(p){
        if(p.eventType==='DELETE'){var o=p.old||{};if(o.id!=null)delete c.map[o.id]}
        else if(p.new&&p.new.id!=null)c.map[p.new.id]=p.new.data;
        if(c.loaded)notificar(c);
      }).subscribe(function(st){if(st==='SUBSCRIBED')go()});
    }catch(e){}
    setTimeout(go,3000);
    setInterval(function(){if(!document.hidden&&started)atualizar(c,name,false)},60000);
    document.addEventListener('visibilitychange',function(){if(!document.hidden&&started)atualizar(c,name,false)});
    return c;
  }
  function docRef(name,id){
    var c=cache(name);
    return {
      id:id,
      set:async function(d){
        d=JSON.parse(JSON.stringify(d));c.map[id]=d;if(c.loaded)notificar(c);
        var r=await sb.from('docs').upsert({collection:name,id:id,data:d},{onConflict:'collection,id'});
        if(r.error){atualizar(c,name,true);throw erro(r.error)}
      },
      update:async function(d){
        d=JSON.parse(JSON.stringify(d));c.map[id]=Object.assign({},c.map[id],d);if(c.loaded)notificar(c);
        var r=await sb.rpc('doc_update',{p_collection:name,p_id:id,p_patch:d});
        if(r.error){atualizar(c,name,true);throw erro(r.error)}
      },
      delete:async function(){
        delete c.map[id];if(c.loaded)notificar(c);
        var r=await sb.from('docs').delete().eq('collection',name).eq('id',id);
        if(r.error){atualizar(c,name,true);throw erro(r.error)}
      },
      onSnapshot:function(f,err){
        c.dl.push({id:id,f:f});if(err)c.errs.push(err);
        if(c.failed&&err)err(c.failed);
        else if(c.loaded)f({exists:Object.prototype.hasOwnProperty.call(c.map,id),data:function(){return c.map[id]}});
        return function(){};
      }
    };
  }
  return {collection:function(name){return {
    doc:function(id){return docRef(name,id||(window.crypto&&crypto.randomUUID?crypto.randomUUID():'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)))},
    add:async function(d){var ref=this.doc();await ref.set(d);return ref},
    onSnapshot:function(f,err){
      var c=cache(name);c.listeners.push(f);if(err)c.errs.push(err);
      if(c.failed&&err)err(c.failed);else if(c.loaded)f({docs:lista(c)});
      return function(){};
    }
  }}};
}

/* ---------- Login e papéis ---------- */
function mostraLogin(msg){$('#login').hidden=false;if(msg){var e=$('#lgErr');e.textContent=msg;e.hidden=false}}
function aplicaPapel(){
  ['tab-base','tab-importar','cfgBtn'].forEach(function(id){var el=$('#'+id);if(el)el.hidden=!isAdmin});
  rota();
}
async function abrirSessao(session){
  var rr=await sb.rpc('my_role'),role=rr&&!rr.error?rr.data:null;
  if(!role){await sb.auth.signOut();mostraLogin('Este e-mail não tem acesso ao funil. Peça ao Filipe para liberar.');return false}
  isAdmin=role==='admin';myId=session.user.email;
  $('#login').hidden=true;$('#who').textContent=myId+(isAdmin?' · admin':' · SDR');
  db=criarDb(sb);
  userNs={id:async function(){return myId},can:async function(){return true},profiles:async function(ids){var o={};ids.forEach(function(i){o[i]={name:String(i).split('@')[0]}});return o}};
  aplicaPapel();iniciarDados();return true;
}
document.addEventListener('submit',async function(e){
  if(e.target.id!=='loginForm')return;e.preventDefault();
  var b=$('#lgGo');b.disabled=true;$('#lgErr').hidden=true;
  try{
    var r=await sb.auth.signInWithPassword({email:$('#lgEmail').value.trim(),password:$('#lgSenha').value});
    if(r.error||!r.data||!r.data.session)mostraLogin('E-mail ou senha incorretos.');
    else await abrirSessao(r.data.session);
  }catch(x){mostraLogin('Não foi possível entrar. Verifique a conexão e tente de novo.')}
  b.disabled=false;
});
async function iniciar(){
  rota();
  var cfg=window.VETOR_CONFIG||{};
  if(!window.supabase){dbError='Não foi possível carregar a biblioteca de login. Verifique a conexão e recarregue a página.';loaded=true;render();return}
  if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY){dbError='Configuração pendente: defina SUPABASE_URL e SUPABASE_ANON_KEY na Vercel e faça um novo deploy.';loaded=true;render();return}
  try{
    sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
    var r=await sb.auth.getSession();
    if(r.data&&r.data.session)await abrirSessao(r.data.session);else mostraLogin();
  }catch(e){console.error('iniciar',e&&e.stack||e);dbError='Falha ao conectar ao banco. Recarregue a página.';loaded=true;render()}
}
function iniciarDados(){
  try{
    db.collection('config').doc('followups').onSnapshot(function(sn){var d=sn.exists&&sn.data();tiposCfg=d&&Array.isArray(d.items)&&d.items.length?d.items:null;renderFiltro();if(loaded&&!openId&&(view==='funil'||view==='dash'))render()},function(){});
    db.collection('config').doc('notificar').onSnapshot(function(sn){var d=sn.exists&&sn.data();notifTel=d&&d.tel||'';if(loaded&&!openId&&view==='funil')render()},function(){});
    db.collection('config').doc('manual').onSnapshot(function(sn){var d=sn.exists&&sn.data();manualCfg=d&&Array.isArray(d.items)&&d.items.length?d.items:null;if(!$('#drawer').hidden)renderManual()},function(){});
    db.collection('config').doc('proporcao').onSnapshot(function(sn){var d=sn.exists&&sn.data();if(d){prop=Object.assign({},prop,d);var f=document.activeElement;if(view==='base'&&$('#lbQtd')&&!(f&&f.closest&&f.closest('#bLib'))){$('#lbQtd').value=prop.qtd;$('#lbA').value=prop.a;$('#lbB').value=prop.b;$('#lbC').value=prop.c;$('#lbOrd').value=prop.ordem;atualizaLiberar()}}},function(){});
    unsub=db.collection('leads').onSnapshot(recebe,function(e){loaded=true;dbError=e&&e.code==='revoked'?'O acesso a este funil foi removido.':'Falha ao carregar os leads. Recarregue a página.';render()});
  }catch(e){console.error('dados',e&&e.stack||e);loaded=true;dbError='Falha ao carregar os leads. Recarregue a página.';render()}
}
renderFiltro();
iniciar();
})();
</script>
